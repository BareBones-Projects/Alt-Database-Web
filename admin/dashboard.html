<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALT DATABASE // ADMIN</title><style>body{font:15px monospace;background:#090b0f;color:#f5f7fa;margin:0}header,main{padding:20px;max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}section{background:#151922;border:1px solid #434a56;border-radius:8px;padding:16px;margin:18px 0}input,select,textarea,button{font:inherit;background:#090b0f;color:white;padding:10px;border:1px solid #636b75;margin:5px;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#e6e9ed;color:#101215}textarea{width:95%;min-height:120px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #323946;padding:8px;text-align:left}#notice{color:#d0d9e5}</style></head><body><header><h1>// ALT DATABASE ADMIN</h1><button id="logout">Logout</button></header><main><p id="notice" role="status"></p><section><h2>Canonical entities</h2><table><thead><tr><th>ID</th><th>Kind</th><th>Name</th><th>Visibility</th></tr></thead><tbody id="entities"></tbody></table></section><section><h2>Create / update record</h2><form id="record"><input name="id" placeholder="Canonical ID" required><select name="kind"><option>location</option><option>star</option><option>planet</option><option>moon</option><option>system</option><option>hex</option><option>route</option><option>character</option><option>faction</option><option>item</option><option>lore</option></select><input name="name" placeholder="Name" required><input name="parent_id" placeholder="Parent ID (optional)"><select name="visibility"><option>draft</option><option>public</option><option>restricted</option></select><textarea name="data" aria-label="JSON record">{"description":""}</textarea><button>Save record</button></form></section><section><h2>Media library</h2><p>Images, videos, text, CSV, JSON and PDF. Small file uploads (8 MiB max). SQL files are imported via reviewed migration scripts, not executed as uploads.</p><table><thead><tr><th>ID</th><th>Filename</th><th>Visibility</th></tr></thead><tbody id="media"></tbody></table><form id="upload"><input name="id" placeholder="Media ID" required><input name="entity_id" placeholder="Linked entity ID (optional)"><select name="visibility"><option>draft</option><option>public</option><option>restricted</option></select><input name="file" type="file" required><button>Upload</button></form></section></main><script src="/admin/app.js" defer></script></body></html>
