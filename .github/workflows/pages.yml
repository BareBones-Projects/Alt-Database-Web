# BareBones Projects, Designed by: Justin Levesque-Welsch.
name: Publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble allowlisted public website
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -R assets _site/
          touch _site/.nojekyll
          for route in fandom-db wiki-db alt-db backend runtime; do test ! -e "_site/$route"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4